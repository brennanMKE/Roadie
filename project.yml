name: SkinAmp
options:
  bundleIdPrefix: com.brennanmke
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  SkinKit:
    path: Packages/SkinKit
  PlayerKit:
    path: Packages/PlayerKit
targets:
  SkinAmp:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: SkinKit
        product: SkinKit
      - package: SkinKit
        product: WindowDocking
      - package: SkinKit
        product: SkinLibrary
      - package: PlayerKit
        product: AudioCore
      - package: PlayerKit
        product: PlexKit
      - package: PlayerKit
        product: TrackCache
      - package: PlayerKit
        product: MusicBackendKit
      - package: PlayerKit
        product: LocalPlayback
      - package: PlayerKit
        product: PlexBackendKit
      - package: PlayerKit
        product: FolderBackendKit
      - package: PlayerKit
        product: LibraryBrowser
      - package: PlayerKit
        product: MusicLibraryKit
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: SkinAmp connects to your Plex Media Server on your local network to browse and play your music.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.brennanmke.skinamp.wsz
            UTTypeDescription: Winamp Classic Skin
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [wsz]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brennanmke.SkinAmp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SkinAmp
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # Unsandboxed for now so the app can read a large local skin corpus by path.
        ENABLE_APP_SANDBOX: NO
        # If the sandbox is ever enabled, add com.apple.security.network.client (docs/plex-music-library.md).
schemes:
  SkinAmp:
    build:
      targets:
        SkinAmp: all
    test:
      targets:
        - package: SkinKit/SkinKitTests
        - package: SkinKit/WindowDockingTests
        - package: SkinKit/SkinLibraryTests
        - package: PlayerKit/AudioCoreTests
        - package: PlayerKit/PlexKitTests
        - package: PlayerKit/TrackCacheTests
        - package: PlayerKit/MusicBackendKitTests
        - package: PlayerKit/LocalPlaybackTests
        - package: PlayerKit/PlexBackendKitTests
        - package: PlayerKit/FolderBackendKitTests
        - package: PlayerKit/LibraryBrowserTests
        - package: PlayerKit/MusicLibraryKitTests
