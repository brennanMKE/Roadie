name: SkinAmp
options:
  bundleIdPrefix: com.brennanmke
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  SkinKit:
    path: Packages/SkinKit
  PlayerKit:
    path: Packages/PlayerKit
targets:
  SkinAmp:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: SkinKit
        product: SkinKit
      - package: SkinKit
        product: WindowDocking
      - package: SkinKit
        product: SkinLibrary
      - package: SkinKit
        product: SkinBrowser
      - package: SkinKit
        product: SkinMuseum
      - package: PlayerKit
        product: AudioCore
      - package: PlayerKit
        product: MusicBackendKit
      - package: PlayerKit
        product: LocalPlayback
      - package: PlayerKit
        product: SendspinKit
      - package: PlayerKit
        product: SendspinPlayback
      - package: PlayerKit
        product: FolderBackendKit
      - package: PlayerKit
        product: LibraryBrowser
      - package: PlayerKit
        product: MusicLibraryKit
      - package: PlayerKit
        product: MusicAssistantKit
      # App extensions embed into Contents/PlugIns and are signed on copy (#0043).
      - target: SkinAmpThumbnail
      - target: SkinAmpPreview
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: SkinAmp connects to your Music Assistant server on your local network to browse and play your music.
        # #0104: Music Assistant discovery browses these (macOS lists them for Local Network access).
        NSBonjourServices:
          - _home-assistant._tcp
          - _music-assistant._tcp
          - _sendspin-server._tcp
        # #0075: macOS returns the Wi-Fi name only with Location access, requested only by "Use Current Network".
        NSLocationUsageDescription: SkinAmp reads your Wi-Fi network name to pick the Music Assistant server for where you are. Your location is not stored or shared.
        NSLocationWhenInUseUsageDescription: SkinAmp reads your Wi-Fi network name to pick the Music Assistant server for where you are. Your location is not stored or shared.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Winamp Classic Skin
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [com.brennanmke.skinamp.wsz]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.brennanmke.skinamp.wsz
            UTTypeDescription: Winamp Classic Skin
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [wsz]
          # #0136: library items dragged onto playlists (MediaIDTransfer).
          - UTTypeIdentifier: com.brennanmke.skinamp.media-id
            UTTypeDescription: SkinAmp Library Item
            UTTypeConformsTo: [public.data]
    # Location Services under the hardened runtime needs this entitlement (#0075). Still unsandboxed.
    entitlements:
      path: App/SkinAmp.entitlements
      properties:
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brennanmke.SkinAmp
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: SkinAmp
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # Unsandboxed for now so the app can read a large local skin corpus by path.
        ENABLE_APP_SANDBOX: NO
        # If the sandbox is ever enabled, add com.apple.security.network.client (docs/music-assistant-integration.md).
  SkinAmpThumbnail:
    type: app-extension
    platform: macOS
    sources: [QuickLook/Thumbnail]
    dependencies:
      - package: SkinKit
        product: SkinKit
    info:
      path: QuickLook/Thumbnail/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.brennanmke.skinamp.wsz]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: QuickLook/Thumbnail/SkinAmpThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brennanmke.SkinAmp.Thumbnail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SkinAmp Thumbnail
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  SkinAmpPreview:
    type: app-extension
    platform: macOS
    sources: [QuickLook/Preview]
    dependencies:
      - package: SkinKit
        product: SkinKit
    info:
      path: QuickLook/Preview/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.brennanmke.skinamp.wsz]
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
    entitlements:
      path: QuickLook/Preview/SkinAmpPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brennanmke.SkinAmp.Preview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SkinAmp Preview
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  SkinAmp:
    build:
      targets:
        SkinAmp: all
    test:
      targets:
        - package: SkinKit/SkinKitTests
        - package: SkinKit/WindowDockingTests
        - package: SkinKit/SkinLibraryTests
        - package: SkinKit/SkinBrowserTests
        - package: PlayerKit/AudioCoreTests
        - package: PlayerKit/MusicBackendKitTests
        - package: PlayerKit/LocalPlaybackTests
        - package: PlayerKit/FolderBackendKitTests
        - package: PlayerKit/LibraryBrowserTests
        - package: PlayerKit/MusicLibraryKitTests
        - package: PlayerKit/MusicAssistantKitTests
        - package: PlayerKit/SendspinKitTests
        - package: PlayerKit/SendspinPlaybackTests
