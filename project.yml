name: Roadie
options:
  bundleIdPrefix: co.sstools
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # #0157: the one version for the app and its extensions. Release builds override the build number
    # (scripts/run-tests-vm.sh --dmg [--build-number N]).
    MARKETING_VERSION: "0.0.4"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SkinKit:
    path: Packages/SkinKit
  PlayerKit:
    path: Packages/PlayerKit
  # #0158: app target only. Exact, because the app's Package.resolved is gitignored (docs/sparkle.md to upgrade).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Roadie:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: SkinKit
        product: SkinKit
      - package: SkinKit
        product: WindowDocking
      - package: SkinKit
        product: SkinLibrary
      - package: SkinKit
        product: SkinBrowser
      - package: SkinKit
        product: SkinMuseum
      # #0194: the test configuration's stand-ins (RoadieConfiguration), used only under `#if DEBUG`. Xcode and XcodeGen
      # have no per-configuration package dependencies (only platform filters), so they link in every configuration;
      # the Release build strips their fixture bundles (postBuildScripts below, ROADIE_STRIP_TEST_FIXTURES).
      - package: SkinKit
        product: SkinMuseumStub
      - package: PlayerKit
        product: MusicAssistantKitStub
      - package: PlayerKit
        product: AudioCore
      - package: PlayerKit
        product: MusicBackendKit
      - package: PlayerKit
        product: LocalPlayback
      - package: PlayerKit
        product: SendspinKit
      - package: PlayerKit
        product: SendspinPlayback
      - package: PlayerKit
        product: FolderBackendKit
      - package: PlayerKit
        product: LibraryBrowser
      - package: PlayerKit
        product: MusicLibraryKit
      - package: PlayerKit
        product: MusicAssistantKit
      - package: Sparkle
      # App extensions embed into Contents/PlugIns and are signed on copy (#0043).
      - target: RoadieThumbnail
      - target: RoadiePreview
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # #0158: Sparkle. Empty in Debug, so the updater never starts there. No SUEnableAutomaticChecks (Sparkle asks
        # once), no SUEnableSystemProfiling, and no installer/downloader service keys: Roadie isn't sandboxed.
        SUFeedURL: $(ROADIE_FEED_URL)
        SUPublicEDKey: $(ROADIE_PUBLIC_ED_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # #0172: Tailscale MagicDNS names over plain http/ws; WireGuard encrypts tailnet traffic.
          NSExceptionDomains:
            "ts.net":
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Roadie connects to your Music Assistant server on your local network to browse and play your music.
        # #0104: Music Assistant discovery browses these (macOS lists them for Local Network access).
        NSBonjourServices:
          - _home-assistant._tcp
          - _music-assistant._tcp
          - _sendspin-server._tcp
        # #0075: macOS returns the Wi-Fi name only with Location access, requested only by "Use Current Network".
        NSLocationUsageDescription: Roadie reads your Wi-Fi network name to pick the Music Assistant server for where you are. Your location is not stored or shared.
        NSLocationWhenInUseUsageDescription: Roadie reads your Wi-Fi network name to pick the Music Assistant server for where you are. Your location is not stored or shared.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Winamp Classic Skin
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [co.sstools.roadie.wsz]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: co.sstools.roadie.wsz
            UTTypeDescription: Winamp Classic Skin
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [wsz]
          # #0136: library items dragged onto playlists (MediaIDTransfer).
          - UTTypeIdentifier: co.sstools.roadie.media-id
            UTTypeDescription: Roadie Library Item
            UTTypeConformsTo: [public.data]
    # #0194: the stubs' fixtures hold recordings of the user's real library and device names; a release must not ship
    # them. Runs before code signing, so the signature seals the stripped bundle. scripts/verify-dmg.sh and the --dmg
    # step app-release-fixtures check the result.
    postBuildScripts:
      - name: Strip test fixtures (Release)
        basedOnDependencyAnalysis: false
        script: |
          [ "${ROADIE_STRIP_TEST_FIXTURES}" = YES ] || exit 0
          resources="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          rm -rf "$resources"/*_MusicAssistantKitStub.bundle "$resources"/*_SkinMuseumStub.bundle
          echo "Stripped the test fixture bundles from $resources"
    # Location Services under the hardened runtime needs this entitlement (#0075). Still unsandboxed.
    entitlements:
      path: App/Roadie.entitlements
      properties:
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.sstools.roadie
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Roadie
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # Unsandboxed for now so the app can read a large local skin corpus by path.
        ENABLE_APP_SANDBOX: NO
        # If the sandbox is ever enabled, add com.apple.security.network.client (docs/music-assistant-integration.md).
      # #0158: Sparkle's feed and EdDSA public key. Public key from `generate_keys --account Roadie` (#0166); Debug leaves both empty so the updater stays off.
      configs:
        Debug:
          ROADIE_FEED_URL: ""
          ROADIE_PUBLIC_ED_KEY: ""
          ROADIE_STRIP_TEST_FIXTURES: NO
        Release:
          ROADIE_FEED_URL: https://roadie.sstools.co/appcast.xml
          ROADIE_PUBLIC_ED_KEY: 1ahuGzRXzcL46eqj/DaWBeqoYKioAZd5+wAWsY52vgc=
          # #0194: see postBuildScripts. The script deletes from the built bundle, so it can't run sandboxed.
          ROADIE_STRIP_TEST_FIXTURES: YES
          ENABLE_USER_SCRIPT_SANDBOXING: NO
  RoadieThumbnail:
    type: app-extension
    platform: macOS
    sources: [QuickLook/Thumbnail]
    dependencies:
      - package: SkinKit
        product: SkinKit
    info:
      path: QuickLook/Thumbnail/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [co.sstools.roadie.wsz]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: QuickLook/Thumbnail/RoadieThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.sstools.roadie.thumbnail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Roadie Thumbnail
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  RoadiePreview:
    type: app-extension
    platform: macOS
    sources: [QuickLook/Preview]
    dependencies:
      - package: SkinKit
        product: SkinKit
    info:
      path: QuickLook/Preview/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [co.sstools.roadie.wsz]
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
    entitlements:
      path: QuickLook/Preview/RoadiePreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.sstools.roadie.preview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Roadie Preview
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  RoadieTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/RoadieTests]
    dependencies:
      - target: Roadie
      # #0210, #0211: the fixture audio library for the model tests. Linked by the test bundle only, never the app.
      - package: PlayerKit
        product: PlayerKitTestFixtures
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Roadie.app/Contents/MacOS/Roadie
        BUNDLE_LOADER: $(TEST_HOST)
        PRODUCT_BUNDLE_IDENTIFIER: co.sstools.roadie.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  # #0200: XCUITests. Run only in the Tart guest by scripts/run-tests-vm.sh --ui (docs/ui-tests-in-vm.md), never on
  # the host: their own scheme ("Roadie UI Tests"); the Roadie scheme's Test action stays unit tests only.
  RoadieUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/RoadieUITests
      - path: App/Accessibility/AXID.swift
    dependencies:
      - target: Roadie
    settings:
      base:
        TEST_TARGET_NAME: Roadie
        PRODUCT_BUNDLE_IDENTIFIER: co.sstools.roadie.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

schemes:
  Roadie:
    build:
      targets:
        Roadie: all
    test:
      targets:
        - RoadieTests
        - package: SkinKit/SkinKitTests
        - package: SkinKit/WindowDockingTests
        - package: SkinKit/SkinLibraryTests
        - package: SkinKit/SkinBrowserTests
        - package: PlayerKit/AudioCoreTests
        - package: PlayerKit/MusicBackendKitTests
        - package: PlayerKit/LocalPlaybackTests
        - package: PlayerKit/FolderBackendKitTests
        - package: PlayerKit/LibraryBrowserTests
        - package: PlayerKit/MusicLibraryKitTests
        - package: PlayerKit/MusicAssistantKitTests
        - package: PlayerKit/SendspinKitTests
        - package: PlayerKit/SendspinPlaybackTests
  # #0200: only scripts/run-tests-vm.sh --ui runs this, inside the guest. ROADIE_TEST_* reach the runner through
  # xcodebuild's environment (TEST_RUNNER_ prefix).
  Roadie UI Tests:
    build:
      targets:
        Roadie: all
        RoadieUITests: [test]
    test:
      targets:
        - RoadieUITests
