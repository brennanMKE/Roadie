name: AirPlaySpike
options:
  bundleIdPrefix: com.brennanmke
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  SpikeKit:
    path: SpikeKit
targets:
  AirPlaySpike:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: SpikeKit
        product: SpikeKit
    info:
      path: Info.plist
      properties:
        # The key under test (#0050): does macOS honor it for an app that is not Music?
        AVInitialRouteSharingPolicy: LongFormAudio
        NSLocalNetworkUsageDescription: AirPlaySpike looks for AirPlay speakers on your network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brennanmke.AirPlaySpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AirPlaySpike
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
